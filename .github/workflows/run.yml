name: 刷步数

on:
  schedule:
    - cron: '55 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 初始化 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
        run: |
          if [[ -z "$CONFIG" ]]; then
            echo "::notice::尚未配置 CONFIG，跳过刷步数"
            exit 0
          fi

          python -m pip install requests pytz
          python main.py
