name: 刷步数

on:
  schedule:
    - cron: '55 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 初始化 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 开始
        shell: bash
        env:
          CONFIG: ${{ secrets.CONFIG }}
        run: |
          if [[ -z "$CONFIG" ]]; then
            echo "::notice::尚未配置 CONFIG，跳过刷步数"
            exit 0
          fi

          python -m pip install -r requirements.txt
          # Only publish known diagnostics because upstream can log raw API responses.
          python -u main.py 2>&1 | awk '
            /^修改步数（[0-9]+）\[success\]$/ { print; next }
            /^登录获取accessToken失败：登录异常，status: [0-9][0-9][0-9]登陆失败！$/ { print; next }
            /^登录获取accessToken失败：获取accessToken失败 [0-9][0-9][0-9]登陆失败！$/ { print; next }
            /^登录获取accessToken失败：/ { print "Zepp Life 登录失败"; next }
            /^登录提取的 access_token 无效：/ { print "华米客户端登录失败"; next }
            /^修改步数（[0-9]+）\[/ { print "华米未确认步数提交"; next }
            /^执行账号总数[0-9]+，成功：[0-9]+，失败：[0-9]+$/ {
              print
              all_succeeded = $0 ~ /，失败：0$/
              reported = 1
            }
            END {
              if (!reported) print "脚本未返回账号执行结果"
              if (!all_succeeded) exit 1
            }
          '
